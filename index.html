<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>図面別 支給品・転用品・既設転用 集計ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --navy:#12283F;
    --blue:#2E6DA4;
    --blue-dark:#1A3A5C;
    --green:#27AE60;
    --amber:#C98A1E;
    --paper:#F6F5F1;
    --line:#D8D4C8;
    --ok-bg:#E8F5E9;
    --warn-bg:#FFF6DC;
    --err-bg:#FDECEA;
    --mono: "Segoe UI","Hiragino Kaku Gothic ProN",sans-serif; /* フォント統一のため本文と同じフォントに変更（旧: 等幅フォント） */
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI","Hiragino Kaku Gothic ProN",sans-serif;
    background:
      linear-gradient(var(--paper),var(--paper)),
      repeating-linear-gradient(0deg, rgba(46,109,164,0.05) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(46,109,164,0.05) 0 1px, transparent 1px 28px);
    color:#26313d;
    min-height:100vh;
  }
  header{
    background:var(--navy); color:#fff; padding:18px 28px;
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    border-bottom:3px solid var(--blue);
  }
  header h1{ font-size:20px; margin:0; letter-spacing:.02em;}
  header span.sub{ font-size:12.5px; color:#B9CBE0; }
  main{ max-width:1180px; margin:0 auto; padding:22px 24px 60px; }
  .panel{
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:18px 20px; margin-bottom:18px;
    box-shadow:0 1px 3px rgba(20,30,40,.06);
  }
  .panel h2{
    font-size:13.5px; margin:0 0 12px; color:var(--blue-dark);
    text-transform:uppercase; letter-spacing:.08em;
    border-left:4px solid var(--blue); padding-left:8px;
  }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px;}
  input[type=file]{ font-size:13px; }
  button{
    background:var(--blue); color:#fff; border:none; border-radius:5px;
    padding:9px 16px; font-size:13.5px; cursor:pointer; font-weight:600;
    transition:filter .15s;
  }
  button:hover{ filter:brightness(1.08); }
  button:disabled{ background:#9AA7B2; cursor:not-allowed; }
  button.green{ background:var(--green); }
  button.ghost{ background:transparent; color:var(--blue); border:1px solid var(--blue); }
  .status{ font-size:12.5px; color:#5b6773; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    background:var(--blue-dark); color:#fff; text-align:left; padding:8px 8px;
    position:sticky; top:0; font-weight:600; font-size:12px; letter-spacing:.02em;
  }
  tbody td{ padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr.ok{ background:var(--ok-bg); }
  tbody tr.warn{ background:var(--warn-bg); }
  tbody tr.err{ background:var(--err-bg); }
  td.mono, .mono{ font-family:var(--mono); }
  td input[type=text]{
    width:100%; border:1px solid #cfd6dc; border-radius:4px; padding:4px 6px; font-size:12.5px;
    font-family:var(--mono);
  }
  td select{ padding:4px 4px; border-radius:4px; border:1px solid #cfd6dc; font-size:12.5px; }
  .badge{
    display:inline-block; font-size:11px; padding:2px 7px; border-radius:10px; font-weight:700;
  }
  .badge.normal{ background:#E4E9EE; color:#42505c; }
  .badge.supply{ background:#DCEFFB; color:#155E8A; }
  .badge.reuse{ background:#FBE9D6; color:#8A5A15; }
  .note{
    font-size:12px; color:#7a6a3a; background:#FFF9E8; border:1px solid #F0DFA8;
    border-radius:6px; padding:10px 14px; margin-top:14px;
  }
  .empty{ padding:40px; text-align:center; color:#8a95a0; font-size:13px; }
  progress{ width:100%; height:8px; }
  #dropZone{
    border:2px dashed #B9C4CC; border-radius:8px; padding:26px 16px;
    text-align:center; color:#6b7680; font-size:13.5px; cursor:pointer;
    transition:background .15s, border-color .15s; width:100%;
  }
  #dropZone.dragover{ background:#EAF3FB; border-color:var(--blue); color:var(--blue-dark); }
  #dropZone .fname{ font-family:var(--mono); font-size:12.5px; color:var(--blue-dark); margin-top:4px; }
  #fileInput{ display:none; }
</style>
</head>
<body>

<header>
  <h1>図面別 支給品・転用品・既設転用 集計ツール</h1>
  <span class="sub">フォルダごと読み込み → 図面ごとに支給品・転用品・既設転用を自動抽出してExcel出力</span>
</header>

<main>

  <div class="panel">
    <h2>1. PDF読み込み</h2>
    <div class="row" style="width:100%;">
      <div id="dropZone">
        フォルダごとドラッグ＆ドロップ（サブフォルダ内のPDFも自動で拾います）、またはクリックしてPDFファイルを選択（複数可）
        <div class="fname" id="dropFileName"></div>
      </div>
      <input type="file" id="fileInput" accept="application/pdf" multiple>
      <input type="file" id="folderInput" webkitdirectory multiple style="display:none;">
    </div>
    <div class="row">
      <button class="ghost" id="btnPickFolder" type="button">フォルダを選択</button>
      <span class="status">クリック選択はPDFファイルのみ、下のボタンはフォルダ丸ごと選択できます。</span>
    </div>
    <div class="row">
      <button id="btnAnalyze" disabled>解析開始（新規）</button>
      <button class="ghost" id="btnAnalyzeAppend" disabled type="button" title="既存の解析結果に、今回選んだPDFの結果を追加します（先に一度「解析開始」が必要です）">解析して追加</button>
      <span class="status" id="statusText"></span>
    </div>
    <progress id="progressBar" value="0" max="100" style="display:none;"></progress>
  </div>

  <div class="panel">
    <h2>2. 出力プレビュー</h2>
    <div id="previewWrap">
      <div class="empty">PDFを読み込み、解析を実行してください。</div>
    </div>
    <div class="row" style="margin-top:14px;">
      <button class="green" id="btnExcel" disabled>Excelを出力</button>
      <button class="ghost" id="btnCopy" disabled type="button">プレビューをコピー（Excel貼り付け用）</button>
      <span class="status" id="saveStatus"></span>
      <span class="status" id="copyStatus"></span>
    </div>
  </div>

<script>
const fileInput   = document.getElementById('fileInput');
const folderInput = document.getElementById('folderInput');
const btnPickFolder = document.getElementById('btnPickFolder');
const btnAnalyze  = document.getElementById('btnAnalyze');
const btnExcel    = document.getElementById('btnExcel');
const btnCopy     = document.getElementById('btnCopy');
const statusText  = document.getElementById('statusText');
const saveStatus  = document.getElementById('saveStatus');
const copyStatus  = document.getElementById('copyStatus');
const progressBar = document.getElementById('progressBar');
const previewWrap = document.getElementById('previewWrap');
const btnAnalyzeAppend = document.getElementById('btnAnalyzeAppend');

let loadedFiles = []; // [{ name, bytes(ArrayBuffer) }, ...]
let pageData = [];
let selectedFiles = []; // 直近に選択・ドロップされたPDFファイル一覧（解析開始ボタンはここを参照する）

const dropZone = document.getElementById('dropZone');
const dropFileName = document.getElementById('dropFileName');

// 外部サーバーへの通信（pdf.jsのワーカー取得等）が
// エラーにもならず応答が返ってこないまま止まってしまうケースに備え、
// 一定時間で強制的にタイムアウトさせて画面が固まったままにならないようにする。
function withTimeout(promise, ms, label) {
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(`${label}がタイムアウトしました（${Math.round(ms / 1000)}秒応答なし。ネットワーク環境の制限が考えられます）`)), ms);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}

// pdf.jsは裏側の解析処理を別スレッド(ワーカー)で行うため、対応するワーカー用スクリプトの
// 場所を明示的に指定する。自動検出に任せると、社内ネットワークの制限等で取得に失敗した際に
// 何のエラーメッセージも出ないまま処理が停止して見える（ボタンがグレーのまま進まない）ことがあるため。
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

fileInput.addEventListener('change', () => {
  onFilesSelected(Array.from(fileInput.files));
});

folderInput.addEventListener('change', () => {
  const files = Array.from(folderInput.files).filter(f => /\.pdf$/i.test(f.name));
  onFilesSelected(files);
});

btnPickFolder.addEventListener('click', () => folderInput.click());

dropZone.addEventListener('click', () => fileInput.click());

// フォルダをドラッグ＆ドロップされた場合、DataTransferItem.webkitGetAsEntry()で
// ディレクトリを再帰的にたどり、サブフォルダ内のPDFも含めてすべて収集する。
// OneDrive/Box等のクラウド同期フォルダでは、同期状態によって個別ファイルの
// 読み取り（entry.file()）が失敗することがあるため、エラー件数を数えて後段で通知する。
let traverseErrorCount = 0;
function traverseEntry(entry, out) {
  return new Promise(resolve => {
    if (entry.isFile) {
      entry.file(
        file => { out.push(file); resolve(); },
        () => { traverseErrorCount++; resolve(); }
      );
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const readBatch = () => {
        reader.readEntries(async entries => {
          if (!entries.length) { resolve(); return; }
          for (const child of entries) { await traverseEntry(child, out); }
          readBatch(); // readEntries()は一度に全件返さない場合があるため繰り返し呼ぶ
        }, () => { traverseErrorCount++; resolve(); });
      };
      readBatch();
    } else {
      resolve();
    }
  });
}

['dragenter', 'dragover'].forEach(evt => {
  dropZone.addEventListener(evt, e => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.add('dragover');
  });
});

['dragleave', 'dragend'].forEach(evt => {
  dropZone.addEventListener(evt, e => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.remove('dragover');
  });
});

dropZone.addEventListener('drop', async e => {
  e.preventDefault();
  e.stopPropagation();
  dropZone.classList.remove('dragover');

  let files = [];
  traverseErrorCount = 0;
  const items = e.dataTransfer.items;
  const hasEntryApi = items && items.length && typeof items[0].webkitGetAsEntry === 'function';
  // 折りたたみ前に取得しておく（フォルダ以外の単純なファイルドロップ時のフォールバック用）
  const flatFiles = Array.from(e.dataTransfer.files);

  if (hasEntryApi) {
    const entries = [];
    for (const it of items) {
      const entry = it.webkitGetAsEntry();
      if (entry) entries.push(entry);
    }
    const hasDir = entries.some(en => en.isDirectory);
    if (hasDir) {
      dropFileName.textContent = 'フォルダを読み込み中...（サブフォルダも走査します）';
    }
    for (const entry of entries) { await traverseEntry(entry, files); }

    // OneDrive/Box等の同期フォルダでは、フォルダ走査APIがファイルを1件も
    // 取得できずに終わることがある。その場合はフラットなファイル一覧
    // （e.dataTransfer.files）へフォールバックする。
    if (!files.length && flatFiles.length) {
      files = flatFiles;
    }
  } else {
    files = flatFiles;
  }

  files = files.filter(f => /\.pdf$/i.test(f.name));
  if (!files.length) {
    dropFileName.textContent = traverseErrorCount > 0
      ? `フォルダの読み取りに失敗した項目が${traverseErrorCount}件ありました（OneDrive/Box等の同期状態が原因の可能性があります）。お手数ですが「フォルダを選択」ボタンでの選択をお試しください。`
      : 'フォルダ内、またはドロップした対象にPDFファイルが見つかりませんでした。';
    return;
  }
  if (traverseErrorCount > 0) {
    dropFileName.textContent = `読み込みに失敗した項目が${traverseErrorCount}件ありました（同期未完了のファイル等の可能性）。`;
  }
  onFilesSelected(files);
});

function onFilesSelected(files) {
  selectedFiles = files;
  btnAnalyze.disabled = !files.length;
  btnAnalyzeAppend.disabled = !files.length || !pageData.length;
  if (files.length === 1) {
    dropFileName.textContent = `選択中: ${files[0].name}`;
  } else if (files.length > 1 && files.length <= 8) {
    dropFileName.textContent = `選択中: ${files.length}ファイル（${files.map(f => f.name).join(', ')}）`;
  } else if (files.length > 8) {
    dropFileName.textContent = `選択中: ${files.length}ファイル（PDF）`;
  } else {
    dropFileName.textContent = 'PDFファイルが見つかりませんでした。';
  }
}

async function runAnalysis(appendMode) {
  const files = selectedFiles;
  if (!files.length) return;
  btnAnalyze.disabled = true;
  btnAnalyzeAppend.disabled = true;
  btnExcel.disabled = true;
  btnCopy.disabled = true;
  copyStatus.textContent = '';
  progressBar.style.display = 'block';
  progressBar.value = 0;
  statusText.textContent = '読み込み中...';

  appendMode = appendMode && pageData.length > 0;
  const baseFileIndex = appendMode ? loadedFiles.length : 0;
  if (!appendMode) {
    loadedFiles = [];
    pageData = [];
  }
  let totalPagesDone = 0;
  let readFailCount = 0;

  // 1ページ分のエラー情報を、後でプレビューに「このページ／ファイルは読み取れなかった」
  // と分かる形で表示できるよう、共通の雛形として持たせておく。
  function makeFailedEntry(sourceName, fi, pageIndex, err, label) {
    return {
      pageIndex, sourceFile: sourceName, fileIndex: baseFileIndex + fi,
      readFailed: true, readError: (err && err.message) ? err.message : String(err),
      drawingNo: '', lawCode: '', issueDate: '', series: '', jobNo: '', projectName: '',
      lineNo: '', tag: 'normal', filename: '', status: `読み取り失敗（${label}）`, cls: 'err', materials: []
    };
  }

  // 途中で1ページ・1ファイル分のエラーが起きても、画面に何も表示されず処理全体が
  // 止まってしまうことがないよう、ファイル単位・ページ単位でそれぞれtry/catchし、
  // 失敗した箇所は「読み取れなかった」ことが分かる形で記録したうえで残りの処理を続行する。
  // （それでも想定外のエラーで抜けてしまった場合に備え、外側にも保険のtry/catchを残す）
  try {
    for (let fi = 0; fi < files.length; fi++) {
      const f = files[fi];
      const sourceName = f.name.replace(/\.pdf$/i, '');

      let pdf, n;
      try {
        const bytes = await f.arrayBuffer();
        loadedFiles.push({ name: sourceName, bytes });
        const loadingTask = pdfjsLib.getDocument({ data: bytes.slice(0) });
        pdf = await withTimeout(loadingTask.promise, 20000, 'PDFの読み込み');
        n = pdf.numPages;
      } catch (fileErr) {
        // ファイル自体が開けない（破損・パスワード付き等）場合は、このファイルだけ
        // 「読み取り失敗」として記録し、他のファイルの解析は続行する。
        console.error(`${f.name} の読み込みに失敗しました`, fileErr);
        readFailCount += 1;
        pageData.push(makeFailedEntry(sourceName, fi, null, fileErr, 'ファイル'));
        continue;
      }

      for (let i = 1; i <= n; i++) {
        statusText.textContent = `解析中... ファイル${fi + 1}/${files.length}（${f.name}） ${i}/${n}ページ`;
        totalPagesDone += 1;
        progressBar.value = Math.round(((fi + i / n) / files.length) * 100);
        try {
          const entry = await analyzePage(pdf, i);
          entry.sourceFile = sourceName;
          entry.fileIndex = baseFileIndex + fi;
          entry.readFailed = false;
          pageData.push(entry);
        } catch (pageErr) {
          // このページだけ解析に失敗した場合も、他のページは止めずに処理を続け、
          // このページだけ「読み取れなかった」ことが分かる形で記録する。
          console.error(`${f.name} ${i}ページ目の解析に失敗しました`, pageErr);
          readFailCount += 1;
          pageData.push(makeFailedEntry(sourceName, fi, i - 1, pageErr, 'ページ'));
        }
        await new Promise(r => setTimeout(r, 0)); // UI描画を挟む
      }
    }

    const modeLabel = appendMode ? '追加' : '解析';
    statusText.textContent = readFailCount > 0
      ? `${modeLabel}完了 今回${files.length}ファイル分・合計${pageData.length}ページ（うち今回読み取れなかったもの ${readFailCount}件。詳細はプレビュー欄をご確認ください）`
      : `${modeLabel}完了 今回${files.length}ファイル分・合計${pageData.length}ページ`;
    renderPreview();
  } catch (err) {
    console.error('解析処理に失敗しました', err);
    statusText.textContent = `解析に失敗しました：${err && err.message ? err.message : err}（ネットワーク環境の制限やPDFの破損等が考えられます。別のPDFやネットワークでお試しください）`;
  } finally {
    progressBar.style.display = 'none';
    // 選択済みファイルはクリアする。「追加」で解析したあと同じファイルのまま
    // ボタンを連打して二重にカウントされるのを防ぐため。
    selectedFiles = [];
    dropFileName.textContent = '';
    btnAnalyze.disabled = true;
    btnAnalyzeAppend.disabled = true;
    btnExcel.disabled = !pageData.length;
    btnCopy.disabled = !pageData.length;
  }
}

btnAnalyze.addEventListener('click', () => runAnalysis(false));
btnAnalyzeAppend.addEventListener('click', () => runAnalysis(true));

// ============================================================
// ページ解析
// ============================================================
async function analyzePage(pdf, pageNum) {
  const page = await pdf.getPage(pageNum);
  // scale:1、回転はページ自身の/Rotateをそのまま反映（省略時のデフォルト）。
  // これにより pw/ph は「実際に表示される向き」の幅・高さになる。
  const viewport = page.getViewport({ scale: 1 });
  const pw = viewport.width, ph = viewport.height;

  let annots = [];
  try { annots = await page.getAnnotations(); } catch (e) { annots = []; }

  const textContent = await page.getTextContent();
  const fullText = textContent.items.map(it => it.str).join('\n');
  // 図面によっては「適用法規」「支給/転用」欄の実際の値がページ本文のテキストレイヤーではなく
  // 注釈(annotation)側にしか存在しないケースがある(getTextContent()には枠のラベルしか
  // 入っておらず、記入された値は取得できない)。そのため注釈の文字列も検索対象に含める。
  const annotText = annots.map(a => getAnnotText(a)).join('\n');
  const searchText = fullText + '\n' + annotText;

  // ---- 図面番号・発行日（右下タイトルブロック内の注釈から） ----
  // pdf.jsの注釈は文字列が contentsObj.str に入るケースがあるため両対応する
  //
  // 【回転ページ対応】getAnnotations()が返す a.rect は、ページの/Rotate(90/270等)を
  // 反映しない「PDF内部の生座標」のまま返ってくる。一方 viewport(pw/ph)は/Rotateを
  // 反映した「表示上の」幅・高さになるため、rectをそのままpw/phと比較すると
  // 回転ページでは全く違う位置として誤判定されてしまう(＝図面番号を検出できず
  // 全ページ「図書リスト」になっていた原因)。
  // viewport.convertToViewportRectangle() で rect を「表示上の」座標系
  // （左上原点・Y下向き）に変換してから判定する。
  let drawingNo = '', issueDate = '', jobNoFromDrawingNo = '';
  for (const a of annots) {
    const contents = getAnnotText(a);
    const d = toDisplayRect(viewport, a.rect || [0, 0, 0, 0]);
    // 表示座標系では「右下」＝ x0が大きい・y1(下端)が大きい、で判定する
    if (contents && !drawingNo && d.x0 > pw * 0.75 && d.y1 > ph * 0.92 &&
        !contents.startsWith('%%') && !contents.includes('SEE')) {
      // 図面番号中央のセグメント（例：L-D-T26001-54-201 の「54」）をJOB No.として拾う
      const m = contents.match(/([A-Z]-[A-Z]-[A-Z]\d{4,6}(?:-(\d{2,3}))?-\d{2,5})/);
      if (m) { drawingNo = m[1]; jobNoFromDrawingNo = m[2] || ''; }
    }
    if (!issueDate) {
      const cd = a.creationDate || a.modificationDate || '';
      const m2 = String(cd).match(/D:20\d{2}(\d{4})/);
      if (m2) issueDate = m2[1];
    }
  }

  // ---- 適用法規 ----
  // pdf.jsのテキスト抽出はPDF内部の格納順（必ずしも見た目の並び順ではない）になるため、
  // 「ラベルの次の文字列」を拾う方式は誤検出しやすい。法規欄の値は種類が限られるため、
  // ページ全体からキーワードを直接検索する方式に変更（順序に依存しない）。
  const lawCode = lawToCode(searchText);
  const lawText = lawCode;

  // ---- 工事No.（図書リストページ用） ----
  function extractJobNo() {
    const patterns = [/工事\s*No\.?\s*[：:\s]\s*(\d+)/, /工事\s*No\.?\s*(\d+)/];
    for (const p of patterns) { const m = fullText.match(p); if (m) return m[1]; }
    const m = fullText.match(/^\s*(\d{2,4})\s+\S/m);
    if (m) return m[1];
    return '06';
  }

  // ---- 種別判定 ----
  const series = getDrawingSeries(drawingNo);
  // JOB No.は図面番号中央のセグメント（例：L-D-T26001-54-201 の「54」）から取得する。
  // 取得できない場合（親図など中央セグメントが無い図面番号の場合）は従来通り'06'を仮値とする。
  const jobNo = series === '図書リスト' ? extractJobNo() : (jobNoFromDrawingNo || '06');

  // ---- 工事名（TITLE欄付近の注釈から） ----
  const projectName = extractProjectName(annots, viewport, pw, ph);

  // ---- ライン番号（LINE No.欄の注釈値から） ----
  const lineNo = extractLineNo(annots, textContent, viewport, ph);

  // ---- 支給品/転用品/既設転用の自動サジェスト ----
  let tag = 'normal';
  if (/既設転用/.test(searchText)) tag = 'existing_reuse';
  else if (/支給/.test(searchText)) tag = 'supply';
  else if (/転用/.test(searchText)) tag = 'reuse';

  const filename = buildFilename(drawingNo, lawCode, issueDate, series, jobNo);

  // ---- 材料集計（材料表：ITEM/SIZE/DESCRIPTION/QTY） ----
  const materials = extractMaterials(annots, textContent, viewport);

  let status, cls;
  if (!drawingNo) { status = '完全(図書リスト)'; cls = 'ok'; }
  else if (series === '要確認') { status = '要確認'; cls = 'warn'; }
  else if (drawingNo && issueDate) { status = '完全'; cls = 'ok'; }
  else if (drawingNo || issueDate) { status = '一部'; cls = 'warn'; }
  else { status = '未検出'; cls = 'err'; }

  return {
    pageIndex: pageNum - 1, drawingNo, lawCode, issueDate, series,
    jobNo, projectName, lineNo, tag, filename, status, cls, materials
  };
}

// pdf.jsの注釈オブジェクトは文字列が `contents`(文字列)ではなく
// `contentsObj.str` に入っている場合があるため、両方に対応する
function getAnnotText(a) {
  return (((a.contentsObj && a.contentsObj.str) || a.contents || '')).trim();
}

// 注釈のPDF内部座標(a.rect、/Rotateを反映しない生座標)を、
// viewport(/Rotateを反映した「表示上の」座標系。左上原点・Y下向き)に変換する。
// 戻り値は x0<=x1, y0<=y1 に正規化したピクセル座標。
function toDisplayRect(viewport, rect) {
  const v = viewport.convertToViewportRectangle(rect);
  return {
    x0: Math.min(v[0], v[2]), x1: Math.max(v[0], v[2]),
    y0: Math.min(v[1], v[3]), y1: Math.max(v[1], v[3])
  };
}

function lawToCode(text) {
  if (!text) return 'N';
  const t = text.replace(/\s|　/g, '');
  if (/消防/.test(t)) return 'F';
  if (/高圧ガス|高圧保安|大臣認定/.test(t)) return 'H';
  if (/低圧ガス|ガス設備|ガス事業/.test(t)) return 'L';
  // 「適用法規」欄に明示的に「NONE」（該当法規なし）と記入されている図面がある。
  // 何も検出できなかった場合の既定値'N'と区別できるよう、専用のコードを割り当てる。
  // 全角/半角スペース除去後は隣接するセルの文字列と連結してしまう（例:"NONEMACHINEBOLT"）ため、
  // 単語境界(\b)は前方のみ要求する。
  if (/(?<![A-Za-z])NONE/i.test(t)) return 'NONE';
  return 'N';
}

// 法規コード(F/H/L/N)を「材料集計(図面別)」シートC列(適用法規)に書き込む表示文字列に変換する。
// 親図・要確認(土建図)には元々適用法規欄が無く lawCode は常に'N'になるため、その場合は空欄にする。
function lawToText(lawCode) {
  if (lawCode === 'F') return '消防法';
  if (lawCode === 'H') return '高圧ガス';
  if (lawCode === 'L') return '低圧ガス';
  if (lawCode === 'NONE') return 'NONE';
  return '';
}

// ---- LINE No.から配管クラス／ガスケットクラス／断熱仕様を読み取る ----
// LINE No.は「サイズ-流体名-配管クラス(/ガスケットクラス)-断熱仕様(...)」という決まった
// 並び順（例："200A-NH3(G)-20A/47-C5(C40)"）になっているが、図面によっては配管クラスの手前に
// 「ライン番号（管理用の通し番号。例："7012"）」という余分なセグメントが挟まる書式がある
// （例："80A-GAS(EVAC)-7012-6/2"）。この場合、配管クラスは3番目（index2）ではなく
// 4番目（index3）にずれる。
// ライン番号セグメントには基本的に"/"が含まれない一方、配管クラスは「配管クラス/ガスケット
// クラス」という書式が必ず守られているため、位置を固定するのではなく「segments[2]以降で
// 最初に"/"を含むセグメント」を配管クラスとして探索する方式にする。
// （探索開始をsegments[1]の流体名からではなくsegments[2]からにすることで、"50A-N2/CP29H-7/13"
// のように流体名側に"/"が入るケースを誤検出しないようにしている。）
// ガスケットクラスが存在せず"/"が1つも無い図面（例："40A-S2-3-H3(t65)"）では、
// 従来通りsegments[2]をそのまま配管クラスとして採用するフォールバックを維持する。
function extractPipeAndGasketClass(lineNo) {
  const s = String(lineNo || '').trim();
  if (!s) return { pipeClass: '', gasketClass: '', insulationSpec: '' };
  const segments = s.split('-');
  if (segments[2] === undefined) return { pipeClass: '', gasketClass: '', insulationSpec: '' };

  // 配管クラス／ガスケットクラスの文字列に紛れ込む半角/全角スペース（例："20A H /47"）と、
  // 括弧書きの日本語注記（例："(大気放出)"）を除去する。前者は図面の版によりクラス記号の
  // 途中にスペースが入る書式があるため、後者はクラス欄ではなく自由記述の注記のため。
  const cleanClass = t => t.replace(/[（(][^）)]*[）)]/g, '').replace(/[\s\u3000]/g, '');

  // segments[2]以降で最初に"/"を含むセグメントのインデックスを探す（見つからなければ-1）。
  let classIdx = -1;
  for (let i = 2; i < segments.length; i++) {
    if (segments[i].indexOf('/') >= 0) { classIdx = i; break; }
  }
  // "/"を含むセグメントが1つも無い場合は、従来通りsegments[2]をそのまま配管クラスとして扱う
  // （ガスケットクラス併記が無い図面向けのフォールバック）。
  if (classIdx === -1) classIdx = 2;

  const classSeg = segments[classIdx];
  const slashIdx = classSeg.indexOf('/');
  const pipeClass = cleanClass(slashIdx >= 0 ? classSeg.slice(0, slashIdx) : classSeg).toUpperCase();
  const gasketClass = slashIdx >= 0 ? cleanClass(classSeg.slice(slashIdx)) : ''; // "/"を含めて後ろ全部
  const nextSeg = segments[classIdx + 1] || '';
  const m = nextSeg.match(/^([A-Za-z0-9]+)/);
  const insulationSpec = m ? m[1].toUpperCase() : '';
  return { pipeClass, gasketClass, insulationSpec };
}

// ---- 支給/転用タグを「材料集計(図面別)」シートJ列(支給/転用)向けの表示文字列に変換 ----
function tagToText(tag) {
  if (tag === 'existing_reuse') return '既設転用';
  if (tag === 'supply') return '支給品';
  if (tag === 'reuse') return '転用品';
  return '';
}

function getDrawingSeries(drawingNo) {
  if (!drawingNo) return '図書リスト';
  const m = drawingNo.match(/-(\d{3,5})$/);
  if (!m) return '不明';
  const num = parseInt(m[1], 10);
  if (num >= 100 && num <= 199) return '親図';
  if (num >= 200 && num <= 599) return 'アイソメ';
  if (num >= 600) return '要確認';
  return '不明';
}

// 【回転ページ対応】以前はa.rectの生座標をそのままpw/phで割って使っていたが、
// 図面番号検出と同じ理由で回転ページ(/Rotate=90/270等)ではズレて機能しなくなるため、
// toDisplayRect()で「表示上の」座標系（左上原点・Y下向き）に変換してから判定する。
function extractProjectName(annots, viewport, pw, ph) {
  const skip = new Set(['DRAWING No.', 'DESCRIPTION', 'APPROVED', 'CHECKED',
    'ORIGINAL', 'BY/DATE', 'DRAFT', 'TITLE', 'CLIENT',
    'FOR', 'REV.', 'No.', 'SCALE', 'JOB No.', 'LINE No.']);
  let titleX = null, titleY = null;
  for (const a of annots) {
    const c = getAnnotText(a);
    if (c === 'TITLE') {
      const d = toDisplayRect(viewport, a.rect || [0, 0, 0, 0]);
      titleX = d.x0 / pw;
      titleY = d.y0 / ph;
      break;
    }
  }
  const candidates = [];
  const asciiOnly = s => /^[A-Z0-9\s/%.&()\-]+$/.test(s);
  if (titleX !== null) {
    for (const a of annots) {
      const contents = getAnnotText(a);
      const d = toDisplayRect(viewport, a.rect || [0, 0, 0, 0]);
      const x0 = d.x0 / pw, y0 = d.y0 / ph;
      // TITLEラベルの右側、かつ同じ行～少し下(表示座標でY+方向)にある値を工事名候補とする
      if (x0 > titleX && y0 > titleY && y0 < titleY + 0.08 &&
          contents.length > 4 && !skip.has(contents) && !asciiOnly(contents)) {
        candidates.push([x0, contents]);
      }
    }
  } else {
    const drawingNoPattern = /[A-Z]-[A-Z]-[A-Z]\d{4,6}/;
    const datePattern = /\d{4}\.\d{1,2}\.\d{1,2}|\d{2,4}年/;
    for (const a of annots) {
      const contents = getAnnotText(a);
      const d = toDisplayRect(viewport, a.rect || [0, 0, 0, 0]);
      const x0 = d.x0 / pw, y0 = d.y0 / ph;
      if (x0 > 0.75 && y0 > 0.80 && y0 < 0.92 &&
          contents.length > 4 && !skip.has(contents) && !asciiOnly(contents) &&
          !drawingNoPattern.test(contents) && !datePattern.test(contents) &&
          !contents.includes('殿') && !contents.includes('工場')) {
        candidates.push([x0, contents]);
      }
    }
  }
  if (candidates.length) {
    candidates.sort((a, b) => a[0] - b[0]);
    return candidates[0][1];
  }
  return '';
}

// ---- ライン番号（LINE No.欄の注釈値から） ----
// 「LINE No.」ラベル自体は本文テキスト側にあるが、実際に記入された値はTITLE欄と同様に
// 注釈(annotation)側に入っている。ラベルのY座標を基準に、右側・ほぼ同じ高さにある
// 注釈のうち「セグメント区切り（-）の文字列」形式（例：20A-N2(686)-5063-1B/47、
// 200A-NH3(G)-20A/47-C5(C40)等）に一致するものをライン番号として採用する。
// 同じ枠内に系統が複数（2行）記載されている図面があるため、その場合は表示上いちばん
// 上の行（Y座標が最小のもの）を優先して採用する。
function extractLineNo(annots, textContent, viewport, ph) {
  let labelX = null, labelY = null;
  for (const it of textContent.items) {
    const s = (it.str || '').trim();
    if (/^LINE\s*No\.?$/i.test(s) || s === 'LINE') {
      const [vx, vy] = viewport.convertToViewportPoint(it.transform[4], it.transform[5]);
      labelX = vx; labelY = vy;
      break;
    }
  }
  // LINE No.の途中セグメントに「/」が含まれる書式（例："50A-N2/CP29H-7/13"）にも対応できるよう、
  // どのセグメントでも「/」を許可する（以前は2番目のセグメントに「/」を認めておらず、
  // このような書式のLINE No.が丸ごと検出できなかった）。
  // 「20A H /47」のように途中に半角スペースが入る書式や、「6/47(大気放出)」のように
  // 括弧書きの日本語注記が付く書式があり、以前は半角英数字・()・/ しか許可していなかった
  // ため、これらの書式のLINE No.が丸ごと検出できず、配管クラス／ガスケットクラスも
  // 連鎖して空欄になっていた。スペース（半角/全角）と日本語（ひらがな/カタカナ/漢字）を
  // 許容文字に追加する。
  const pattern = /^[0-9]{1,4}[A-Za-z]{0,4}-[A-Za-z0-9()/\s\u3000-\u30FF\u4E00-\u9FFF]+-[A-Za-z0-9()/\s\u3000-\u30FF\u4E00-\u9FFF]+(-[A-Za-z0-9()/\s\u3000-\u30FF\u4E00-\u9FFF]+)*$/;
  // 複数行（同じ枠内に2系統）記載されているケースを拾えるよう、判定の許容幅は広めに取る。
  const regionTolerance = Math.max(40, ph * 0.06);
  const candidates = [];
  for (const a of annots) {
    const contents = getAnnotText(a);
    if (!contents || !pattern.test(contents)) continue;
    const d = toDisplayRect(viewport, a.rect || [0, 0, 0, 0]);
    if (labelX !== null) {
      if (d.x0 < labelX - 5) continue; // ラベルより左側は対象外
      const dist = Math.abs(d.y0 - labelY);
      if (dist > regionTolerance) continue; // ラベル付近（同じ枠内）のみ候補にする
      candidates.push([d.y0, contents]); // 距離ではなくY座標そのものでソートし、一番上を選ぶ
    } else {
      candidates.push([d.y0, contents]);
    }
  }
  if (candidates.length) {
    candidates.sort((a, b) => a[0] - b[0]); // Y座標が最小＝表示上いちばん上を採用
    return candidates[0][1];
  }
  return '';
}

// ============================================================
// 材料集計（材料表：ITEM/SIZE/DESCRIPTION/QTY）
// ============================================================
// 材料表は「品目ラベル（本文テキスト、位置固定の凡例）」×「SIZE/DESCRIPTION/QTY（注釈データ）」
// のマトリクス様式。品目ラベルのY座標を基準に行の帯を作り、そこに落ちる注釈をX座標で
// 列判定して紐付ける。テンプレートの多少のズレに耐えられるよう、見出し(ITEM/SIZE/
// DESCRIPTION/QTY)の実際の位置から列境界を都度計算する。
const MATERIAL_ROW_DEFS = [
  { key: 'PIPE',         test: s => s === 'PIPE' },
  { key: '90°ELBOW',     test: s => s === '90°' },
  { key: '45°ELBOW',     test: s => s === '45°' },
  { key: 'TEE',          test: s => s === 'TEE' },
  { key: 'CON.REDUCER',  test: s => s === 'CON.' },
  { key: 'ECC.REDUCER',  test: s => s === 'ECC.' },
  { key: 'FLANGE',       test: s => s === 'FLANGE' },
  { key: 'GASKET',       test: s => s === 'GASKET' },
  // 「MACHINE BOLT」「MACHINE BOLT&NUT」「マシンBOLT」「マシンBOLT&NUT」「STUD BOLT」等、
  // テンプレートにより表記が微妙に異なる（スペースの有無・「&NUT」の有無・日英表記など）。
  // 逐一の完全一致では表記ゆれのたびに漏れが出るため、「BOLT」という文字列を含むかどうかで
  // 判定する（品目としては従来通り「BOLT&NUT」1つに集約し、マシン/スタッドの別は下の
  // deriveBoltType()で「ボルト種別」列に別途記録する）。
  { key: 'BOLT&NUT',     test: s => String(s).toUpperCase().includes('BOLT') },
  // テンプレートによっては共通見出し「VALVE」がなく、弁種ごと（ボール弁／チェッキ弁 等）に
  // 直接ラベルが振られている場合がある。いずれも「VALVE」行として集計する。
  { key: 'VALVE',        test: s => s === 'VALVE' || ['ボール弁', 'チェッキ弁', 'ゲート弁', '仕切弁', 'グローブ弁', 'バタフライ弁', '安全弁', '逆止弁', '電磁弁', 'ストップ弁'].includes(s) },
  { key: 'COUPLING',     test: s => s === 'COUPLING' || s === 'コネクター' },
  { key: 'BOSS',         test: s => s === 'BOSS' },
  { key: 'BF加工品',      test: s => String(s).replace(/[.．]/g, '') === 'BF加工品' },
  { key: 'XV',           test: s => s === 'XV' },
  // 「PSV」「PA」「PG」は図面上、それぞれ独立した品目ラベルとして並んで印字されているが、
  // 以前はPGしか認識していなかったため、PSV/PAの行データが（一番近い認識済みラベルである）
  // PGの帯に取り込まれ、品目「PG」として誤集計されていた。PSV/PAも独立した品目として追加する。
  { key: 'PSV',          test: s => s === 'PSV' },
  { key: 'PA',           test: s => s === 'PA' },
  { key: 'PG',           test: s => s === 'PG' },
  { key: 'N2減圧弁',      test: s => s === 'N2 減圧弁' || s === '減圧弁' },
  { key: '窒素ボンベ',     test: s => s === '窒素ボンベ' },
  { key: 'ハーフユニオン',  test: s => s === 'ハーフユニオン' },
  { key: 'PLUG',         test: s => s === 'PLUG' },
  { key: 'NIPPLE',       test: s => s === '六角ニップル' || s === 'ニップル' },
  { key: 'PRESSURE GAUGE', test: s => s === '圧力計' },
  { key: 'BLIND FLANGE', test: s => s === 'BLIND FLANGE' || s === 'ブラインドフランジ' },
];

// BOLT&NUT行の品目ラベル（実際にテンプレートに印字されていた文字列）から、
// マシンボルトかスタッドボルトかを判定する。BOLT&NUT以外の品目では常に空文字。
// こちらも完全一致ではなく「STUD」「MACHINE／マシン」を含むかどうかで判定し、
// スペースや「&NUT」の有無などの表記ゆれに対応する。
function deriveBoltType(label) {
  const t = String(label || '').toUpperCase();
  if (t.includes('STUD')) return 'スタッド';
  if (t.includes('MACHINE') || t.includes('マシン')) return 'マシン';
  return '';
}

// 「品目」列に表示する文字列を、ボルト種別を踏まえて決定する。
// BOLT&NUT以外の品目、またはボルト種別が判定できなかった場合はそのまま品目名を返す。
// BOLT&NUTでボルト種別が判定できた場合は、図面上の実際の表記に合わせて
// 「MACHINE BOLT&NUT」「STUD BOLT&NUT」のように種別を品目名に含めて表示する
// （集計・数式上のキーとしても、この表示用の文字列をそのまま使う）。
function boltDisplayItem(item, boltType) {
  if (item !== 'BOLT&NUT' || !boltType) return item;
  if (boltType === 'マシン') return 'MACHINE BOLT&NUT';
  if (boltType === 'スタッド') return 'STUD BOLT&NUT';
  return item;
}

// テンプレートによっては、品目ラベル（VALVE等）が横書きではなく縦書き（90°回転）で
// 1文字ずつ描画されている場合がある。この場合pdf.jsのgetTextContent()も1文字ずつの
// アイテムとして返し、しかも文字の並び順（本文テキスト抽出順）が実際の読み順（多くは
// 下→上）と一致しないため、通常のcompareLoop（def.test(s)の完全一致）では検出できない。
// そこでX座標がほぼ同じ短い文字列アイテムをY方向にグループ化し、上→下・下→上の両方の
// 並びで結合した文字列をMATERIAL_ROW_DEFSと照合することで、縦書きラベルも品目アンカーとして
// 拾えるようにする（例：「E」「V」「L」「A」「V」→下から読むと「VALVE」）。
function collectVerticalAnchors(textContent, viewport, boundLeft) {
  const raw = [];
  for (const it of textContent.items) {
    const s = (it.str || '').trim();
    if (!s || s.length > 3) continue; // 縦書きは1〜数文字ずつ描画されるケースを想定
    const [vx, vy] = viewport.convertToViewportPoint(it.transform[4], it.transform[5]);
    if (vx >= boundLeft) continue; // 品目ラベル列（左側）のみ対象
    raw.push({ x: vx, y: vy, text: s });
  }
  if (raw.length < 3) return [];

  // X座標が近い（＝同じ縦ラインに並ぶ）文字ごとにグループ化する
  const XTOL = 3;
  const groups = [];
  for (const c of raw) {
    let g = groups.find(g => Math.abs(g.x - c.x) <= XTOL);
    if (!g) { g = { x: c.x, members: [] }; groups.push(g); }
    g.members.push(c);
  }

  const anchors = [];
  for (const g of groups) {
    if (g.members.length < 3) continue; // 1〜2文字だけでは誤判定しやすいため除外
    const sorted = [...g.members].sort((a, b) => a.y - b.y);
    // 同じ縦ラインでも離れた位置にある別々のラベルを混同しないよう、隣接文字間の
    // Y間隔が急に広がったところで別グループに分割する
    const runs = [];
    let cur = [sorted[0]];
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap > 20) { runs.push(cur); cur = [sorted[i]]; }
      else cur.push(sorted[i]);
    }
    runs.push(cur);

    for (const run of runs) {
      if (run.length < 3) continue;
      const forward = run.map(c => c.text).join('');
      const backward = [...run].reverse().map(c => c.text).join('');
      for (const candidate of [forward, backward]) {
        for (const def of MATERIAL_ROW_DEFS) {
          if (def.test(candidate)) {
            // ラベルは各行の「下端」付近に位置する規則に合わせ、Y座標は最も下（最大値）を使う
            anchors.push({ key: def.key, y: run[run.length - 1].y, label: candidate });
          }
        }
      }
    }
  }
  return anchors;
}

function extractMaterials(annots, textContent, viewport) {
  // ---- 列境界（見出しITEM/SIZE/DESCRIPTION/QTYの実位置から算出） ----
  // 「DESCRIPTION」は改訂履歴欄にも同名の見出しがあるため、ページ最上部（Y座標最小）
  // のものを材料表の見出しとして採用する（テキスト出現順ではなく座標で判定）。
  const headerCandidates = {};
  for (const it of textContent.items) {
    const s = (it.str || '').trim();
    if (['ITEM', 'SIZE', 'DESCRIPTION', 'QTY'].includes(s)) {
      const [vx, vy] = viewport.convertToViewportPoint(it.transform[4], it.transform[5]);
      if (!headerCandidates[s] || vy < headerCandidates[s].y) {
        headerCandidates[s] = { x: vx, y: vy };
      }
    }
  }
  const bounds = computeMaterialColumns(headerCandidates);
  if (!bounds) return []; // 材料表の見出しが見つからないページ（親図・図書リスト等）は対象外

  // 注釈の平均文字高さ（行の帯の判定・複数行ラベルの結合判定の両方で使う目安値）。
  // テンプレートによって文字サイズが多少変わるため固定値にせず実データから推定する。
  let heightSum = 0, heightCount = 0;
  for (const a of annots) {
    const text = getAnnotText(a);
    if (!text) continue;
    const d = toDisplayRect(viewport, a.rect || [0, 0, 0, 0]);
    const h = d.y1 - d.y0;
    if (h > 0) { heightSum += h; heightCount++; }
  }
  const avgH = heightCount ? heightSum / heightCount : 8;

  // ---- 行の帯（品目ラベルのY座標→隣接ラベルの中間点で境界決定） ----
  const anchors = [];
  for (const it of textContent.items) {
    const s = (it.str || '').trim();
    for (const def of MATERIAL_ROW_DEFS) {
      if (def.test(s)) {
        const [vx, vy] = viewport.convertToViewportPoint(it.transform[4], it.transform[5]);
        anchors.push({ key: def.key, y: vy, x: vx, label: s });
        break;
      }
    }
  }

  // 縦書き（90°回転・1文字ずつ描画）の品目ラベルを救済する（例：VALVE等）。
  // 通常の横書きラベルは上のループで既に拾えているため、ここでは重複しても
  // buildRowBands側で同一キーは先頭（Y座標が最小＝最初に見つかったもの）のみ
  // 採用されるため問題ない。
  anchors.push(...collectVerticalAnchors(textContent, viewport, bounds.boundLeft));

  // MATERIAL_ROW_DEFSに未登録の品目（例：Yストレーナー、スチームトラップ等、
  // テンプレートに新たに追加された品目）も取りこぼさないよう、品目ラベル列に印字
  // されている未知のテキストを、その文字列自体を品目名としてアンカー化する。
  //
  // 実データで座標を確認したところ、品目ラベル（VALVE/FLANGE/新規品目等）はいずれも
  // SIZE列のすぐ左、幅120pt程度の狭い帯に収まっている一方、改訂履歴欄・流体条件欄等の
  // 無関係なラベル（TITLE/REV./KPa/内部流体名称等）はそこから大きく離れた位置
  // （さらに左）にある。そのため「SIZE列の左端から一定幅の帯」だけを対象にすることで、
  // 品目ラベルだけを的確に拾い、離れた場所にある別表のラベルは自動的に除外できる。
  // （品目ラベル文字列は長さがまちまちで左揃え位置が微妙にずれるため、帯は余裕を
  // 持たせた幅にしている。）
  const KNOWN_HEADER_TEXTS = new Set(['ITEM', 'SIZE', 'DESCRIPTION', 'QTY']);
  const NOISE_LABEL_PATTERN = /^[\d.,:：%\-\/]+$/;
  const BOLT_CONTINUATION_PATTERN = /^(MACHINE|マシン|STUD|スタッド|&|NUT|ナット)$/i;
  // 図面の情報欄・検査欄に定型で出てくるラベル（品目ではない）。上記の帯による絞り込みに
  // 加えた保険として、既知の紛れ込みやすいものを明示的にも除外しておく。
  const NON_ITEM_LABEL_PATTERN = /^(LINE|TITLE|ISOME|REV\.?|CLIENT|JOB|JOB\s*NO\.?|DRAWING\s*NO\.?|NO\.?|プレファブ溶接部|現場溶接部|非破壊検査|耐圧試験媒体\/?圧力?|気密試験媒体\/?圧力?|W部|BW部|SW部|内部流体名称|設計圧力|設計温度|溶接後熱処理|断熱|適用法規|NONE|ORIGINAL|DRAFT|CHECKED|APPROVED|DATE|KPa)$/i;
  const tableTopY = Math.min(...Object.values(headerCandidates).map(h => h.y));
  // 品目ラベル列の帯：SIZE列の左端（boundLeft）から、列幅(colW)の2.5倍（余裕を持たせた値）
  // だけ左に広げた範囲。実データでは品目ラベルはboundLeftの60pt程度手前までに収まって
  // おり、無関係な別表のラベルはさらに数百pt左にあるため、この帯で十分に区別できる。
  const colWForBand = bounds.boundSizeDesc - bounds.boundLeft;
  const itemLabelBandLeft = bounds.boundLeft - Math.max(80, colWForBand * 2.5);
  for (const it of textContent.items) {
    const s = (it.str || '').trim();
    if (!s || s.length < 2) continue;
    if (KNOWN_HEADER_TEXTS.has(s.toUpperCase())) continue;
    if (NOISE_LABEL_PATTERN.test(s)) continue;
    if (BOLT_CONTINUATION_PATTERN.test(s)) continue;
    if (NON_ITEM_LABEL_PATTERN.test(s)) continue;
    if (MATERIAL_ROW_DEFS.some(def => def.test(s))) continue; // 既知品目は上のループで処理済み
    const [vx, vy] = viewport.convertToViewportPoint(it.transform[4], it.transform[5]);
    if (vx >= bounds.boundLeft || vx < itemLabelBandLeft) continue; // 品目ラベル列の帯から外れたものは対象外
    if (vy < tableTopY) continue; // 見出し行より上（表の外）は対象外
    anchors.push({ key: s, y: vy, x: vx, label: s, isDynamic: true });
  }

  // 「MACHINE BOLT & NUT」等は、テンプレートによって「MACHINE BOLT」「&」「NUT」のように
  // 複数行に分けて印字されている場合がある。このとき2つの問題が起きる。
  // ①上のループでは「BOLT」を含む行（＝品目としてはBOLT&NUTと判定できる行）だけが
  //   アンカーとして拾われ、ボルト種別判定に必要な「MACHINE」「STUD」の文字が別行の
  //   ため取りこぼされ、ボルト種別（マシン/スタッド）が空欄になってしまう。
  // ②さらに、アンカーのY座標は「BOLT」の行（＝ラベル全体では上のほうの行）のままに
  //   なるため、行の帯の下端がラベル本来の下端（「NUT」の行）より浅い位置で区切られて
  //   しまう。その結果、品目枠内に複数行分のデータ（サイズ違いのボルトが2行など）が
  //   ある場合、2行目以降が下の帯（次の品目＝VALVE等）に誤って入ってしまう。
  // そのため、品目ラベル列（SIZE列より左）にある「MACHINE」「STUD」「&」「NUT」の行を
  // BOLT&NUTアンカーの近くから探し、①ラベル文字列への合成と②アンカーのY座標を
  // それらの行のうち最も下（＝実際のラベル枠の下端）まで引き下げる処理を行う。
  const boltAnchors = anchors.filter(a => a.key === 'BOLT&NUT');
  if (boltAnchors.length) {
    const CONTINUATION_PATTERN = /^(MACHINE|マシン|STUD|スタッド|&|NUT|ナット)$/i;
    const mergeTolerance = Math.max(12, avgH * 3); // 数行分離れていても拾えるよう広めに取る
    for (const it of textContent.items) {
      const s = (it.str || '').trim();
      if (!s || !CONTINUATION_PATTERN.test(s)) continue;
      if (MATERIAL_ROW_DEFS.some(def => def.test(s))) continue; // 既にBOLTを含む等、単独でアンカー化済みの行は対象外
      const [vx, vy] = viewport.convertToViewportPoint(it.transform[4], it.transform[5]);
      if (vx >= bounds.boundLeft) continue; // 品目ラベル列より右（値エリア）は対象外
      let nearest = null, nearestDist = Infinity;
      for (const ba of boltAnchors) {
        const dist = Math.abs(ba.y - vy);
        if (dist < nearestDist) { nearest = ba; nearestDist = dist; }
      }
      if (nearest && nearestDist <= mergeTolerance) {
        nearest.label = nearest.label + ' ' + s;
        nearest.y = Math.max(nearest.y, vy); // ラベル内で最も下の行までアンカーのY座標を引き下げる
      }
    }
  }

  const bands = buildRowBands(anchors);
  if (!bands.length) return [];

  // ---- 値データを行の帯×列境界に振り分け ----
  // 値（SIZE/DESCRIPTION/QTY）は、テンプレートによってPDF注釈（フォーム入力値）として
  // 埋め込まれている場合と、注釈を使わず通常のテキストとして直接印字されている場合の
  // 両方があるため、両方から収集する（同一テンプレートで両方に同じ値が重複することは
  // 想定していないため、単純に合算する）。
  const cells = [];
  for (const a of annots) {
    const text = getAnnotText(a);
    if (!text) continue;
    const d = toDisplayRect(viewport, a.rect || [0, 0, 0, 0]);
    cells.push({ yc: (d.y0 + d.y1) / 2, xc: (d.x0 + d.x1) / 2, x0: d.x0, text });
  }
  const headerTexts = new Set(['ITEM', 'SIZE', 'DESCRIPTION', 'QTY']);
  for (const it of textContent.items) {
    const s = (it.str || '').trim();
    if (!s || headerTexts.has(s.toUpperCase())) continue;
    const [vx, vy] = viewport.convertToViewportPoint(it.transform[4], it.transform[5]);
    if (vx < bounds.boundLeft) continue; // 品目ラベル列（左側）は値ではないため対象外
    cells.push({ yc: vy, xc: vx, x0: vx, text: s });
  }
  // 同一の品目枠内で「実際に何行分のデータが入っているか」を判定するためのY方向の許容誤差。
  // ページ全体のテキスト高さの平均（avgH）だけを基準にすると、材料表と無関係な寸法線・表題欄の
  // 大きな注釈に引っ張られて実際の行間より緩くなり、隣り合う別の行同士が誤って1行にまとまって
  // しまうことがある（SIZE欄が「20A 15A」のように二重に入る不具合の原因）。
  // そのため、材料表のSIZE列セルの実際のY方向の間隔（行ピッチ）からも見積もり、
  // 両者のうち小さい方（より厳しい方）を採用することで、隣接行の誤結合を防ぐ。
  const sizeColYs = cells
    .filter(c => c.xc >= bounds.boundLeft && c.xc < bounds.boundSizeDesc)
    .map(c => c.yc)
    .sort((a, b) => a - b);
  const rowGaps = [];
  for (let i = 1; i < sizeColYs.length; i++) {
    const g = sizeColYs[i] - sizeColYs[i - 1];
    if (g > 1) rowGaps.push(g); // ほぼ同じY（同一行内の別セル）は行ピッチの計算から除外
  }
  rowGaps.sort((a, b) => a - b);
  const medianRowGap = rowGaps.length ? rowGaps[Math.floor(rowGaps.length / 2)] : null;
  const rowYTolerance = medianRowGap
    ? Math.max(3, Math.min(avgH * 0.6, medianRowGap * 0.5))
    : Math.max(3, avgH * 0.6);

  return rowsFromCells(cells, bands, bounds, rowYTolerance);
}

// ============================================================
// 材料表：共通ヘルパー
// ============================================================

// ITEM/SIZE/DESCRIPTION/QTYの見出し位置から、SIZE/DESCRIPTION/QTYの列境界を算出する。
// headerCandidates: { ITEM?:{x,y}, SIZE?:{x,y}, DESCRIPTION?:{x,y}, QTY?:{x,y} }
function computeMaterialColumns(headerCandidates) {
  const headerX = {};
  for (const k of ['ITEM', 'SIZE', 'DESCRIPTION', 'QTY']) {
    if (headerCandidates[k]) headerX[k] = headerCandidates[k].x;
  }
  if (headerX.SIZE === undefined || headerX.DESCRIPTION === undefined || headerX.QTY === undefined) {
    return null;
  }
  // 列境界はSIZE/DESCRIPTION/QTY見出しの実位置を基準に算出する。
  // ・左端：SIZE列自体の手前わずかで区切る（ITEM列との中間点だと改訂記号の丸数字等を誤って拾うため）
  // ・DESCRIPTION/QTY境界：QTY列は数量(1〜2桁)のみで実際は狭いため、中間点よりQTY側に寄せる
  const colW = headerX.DESCRIPTION - headerX.SIZE;
  return {
    boundLeft:     headerX.SIZE - colW * 0.3,
    boundSizeDesc: (headerX.SIZE + headerX.DESCRIPTION) / 2,
    boundDescQty:  headerX.DESCRIPTION + (headerX.QTY - headerX.DESCRIPTION) * 0.75,
    boundQtyEnd:   headerX.QTY + (headerX.QTY - headerX.DESCRIPTION) * 0.15
  };
}

// 品目ラベルのアンカー(y座標)一覧から、重なりのない行の帯を構築する。
// 帯同士の境界を隣接するアンカー間でぴったり一致させることで、境界付近のデータが
// 二重に振り分けられる不具合を防ぐ（GASKETとBOLT&NUTの間の注記が両方に入る、等）。
function buildRowBands(anchors) {
  if (!anchors.length) return [];
  const sorted = [...anchors].sort((a, b) => a.y - b.y);
  const seenKeys = new Set();
  const rows = sorted.filter(a => (seenKeys.has(a.key) ? false : (seenKeys.add(a.key), true)));
  // 実データで確認したところ、品目ラベルは各行の「下端」付近に位置し、
  // SIZE/DESCRIPTION/QTYの値はラベルより上側（前の行のラベルより下）に入る。
  return rows.map((r, i) => {
    const y0 = i === 0 ? -Infinity : rows[i - 1].y + 4;
    const y1 = r.y + 4;
    return { key: r.key, y0, y1, label: r.label };
  });
}

// Y座標が近いセル同士を1つの物理行としてグループ化する（連結成分方式）。
function clusterByY(list, tolerance) {
  const sorted = [...list].sort((a, b) => a.yc - b.yc);
  const clusters = [];
  let current = [];
  let lastY = null;
  for (const c of sorted) {
    if (lastY === null || Math.abs(c.yc - lastY) <= tolerance) {
      current.push(c);
    } else {
      clusters.push(current);
      current = [c];
    }
    lastY = c.yc;
  }
  if (current.length) clusters.push(current);
  return clusters;
}

function avgY(cluster) {
  return cluster.reduce((s, c) => s + c.yc, 0) / cluster.length;
}

// GASKETとBOLT&NUTは、品目ラベルの印字位置が行グループの中央寄り・上寄りなど図面によって
// バラつくため、Y座標による行の帯判定だけでは境界付近の行が逆の品目に誤って入ることがある
// （例：GASKETの後半行がBOLT&NUTの帯にはみ出す）。この2品目は表記パターンがはっきり異なる
// （ボルトは「M16x60L」等の径×長さ表記、ガスケットは「JIS10K RF」等のJISクラス表記で始まる）ため、
// 座標判定の結果をDESCRIPTIONの内容で最終チェックし、矛盾があれば品目を補正する。
const BOLT_DESC_PATTERN = /^[MW]\d+(?:\/\d+)?["']?\s*[xX×]\s*\d+/; // 例: M16x60L / W3/8"x2
const GASKET_DESC_PATTERN = /^JIS\d+K.*V[＃#]/i; // 例: JIS10K RF V#7020 1.5t（V#はガスケットのリング材番号で、FLANGE等の「JIS10K SOP.FF」等とは区別できる）
const PIPE_FITTING_DESC_PATTERN = /SCH\d+S?(?:\s*[×xX]\s*SCH\d+S?)?\s*BW/i; // 例: SCH10S BW / SCH10S×SCH40 BW（配管・エルボ・チーズ・レジューサ類の溶接規格）

// 材質欄の「SCH〇〇×SCH〇〇」（レジューサー等の規格違い並記）、「50A×25A」（径×径）、
// 「M16x60L」（径×長さ）といった表記は、全角×・半角x・大文字Xが図面によって混在する。
// サイズ欄と同様、これらもすべて全角×に統一する。
// ただし材質欄は「EX'T」「APPROX」等、xを含む単なる英単語も混在するため、サイズ欄のような
// 無条件の一律置換はできない。そのため「数値（Aが付く呼び径表記も含む）とx/X/×に挟まれた数値」
// という、実際に×の意味で使われているパターンにだけ絞って置換する。
const SCH_X_SCH_PATTERN = /(SCH\d+S?)\s*[×xX]\s*(SCH\d+S?)/gi;
const NUMERIC_X_NUMERIC_PATTERN = /(\d+A?["']?)\s*[×xX]\s*(?=\d)/g;
function normalizeMaterialText(desc) {
  return String(desc || '')
    .replace(SCH_X_SCH_PATTERN, (whole, a, b) => `${a}×${b}`)
    .replace(NUMERIC_X_NUMERIC_PATTERN, (whole, a) => `${a}×`);
}
// フランジの表記（JISクラス＋SOP.FF/FF/RF等のフェイス記号＋SUSF304等の材質記号）は、
// ガスケットのJISクラス＋V#（リング材番号）表記とは排他的なので、これで判別できる。
const FLANGE_DESC_PATTERN = /^JIS\d+K.*SUSF\d+/i; // 例: JIS10K SOP.FF SUSF304
function reclassifyBoltGasket(row) {
  const isBoltDesc = BOLT_DESC_PATTERN.test(row.description);
  const isGasketDesc = !isBoltDesc && GASKET_DESC_PATTERN.test(row.description);
  const isPipeFittingDesc = !isBoltDesc && !isGasketDesc && PIPE_FITTING_DESC_PATTERN.test(row.description) && !/SUSF/i.test(row.description);
  const isFlangeDesc = !isBoltDesc && !isGasketDesc && FLANGE_DESC_PATTERN.test(row.description);
  if (isBoltDesc && row.item !== 'BOLT&NUT') {
    // ボルト径の頭文字（M=マシンボルト／W=スタッドボルト）からボルト種別も推定する
    const boltType = /^W/.test(row.description) ? 'スタッド' : 'マシン';
    return { ...row, item: 'BOLT&NUT', boltType };
  }
  if (isGasketDesc && row.item !== 'GASKET') {
    return { ...row, item: 'GASKET', boltType: '' };
  }
  // FLANGEは品目ラベルの帯位置とデータ行の印字位置が図面によってズレることがあり、
  // 後半の行がGASKETの帯にはみ出して「品目：GASKET」に誤分類されることがある。
  // SUSF材質記号（ガスケットのV#表記とは排他的）があればFLANGEに補正する。
  if (isFlangeDesc && row.item === 'GASKET') {
    return { ...row, item: 'FLANGE', boltType: '' };
  }
  // TEE等の配管継手はFLANGE（JISクラス＋SUSF材質表記）と品目ラベルの帯位置が近く、
  // 最後の1行がFLANGE側にはみ出すことがある。SCH表記でSUSF（フランジ材質記号）を含まない場合は
  // 配管継手側のデータと判断し、直前の品目であるTEEへ補正する。
  if (isPipeFittingDesc && (row.item === 'FLANGE' || row.item === 'BLIND FLANGE')) {
    return { ...row, item: 'TEE' };
  }
  // ハーフユニオン（銅管継手）はニップルと品目ラベルの帯位置が近く、最後の1行がNIPPLE側に
  // はみ出すことがある。「銅管継手」表記はハーフユニオン特有のため、この表記があれば補正する。
  if (row.item === 'NIPPLE' && /銅管継手/.test(row.description)) {
    return { ...row, item: 'ハーフユニオン' };
  }
  return row;
}

// セル群(cells: {yc,xc,x0,text})を実際の行単位（Y座標が近いセルのまとまり）にグループ化してから、
// 各行がどの品目の帯（Y範囲）に属するかを判定する。
// 先に品目の帯でセルを絞り込んでから行をまとめる順序だと、品目の境界線がちょうど1行の途中
// （例：SIZE/DESCRIPTIONは境界の内側、材質欄だけ境界の外側）を横切った場合に、
// 本来1行のはずのデータが2つの品目に引き裂かれてしまう。行をまとめるのを先に行うことで、
// この「1行が品目の境界で分断される」問題を避ける。
function rowsFromCells(cells, bands, bounds, rowYTolerance) {
  const result = [];
  const inTable = cells.filter(c => c.xc >= bounds.boundLeft && c.xc < bounds.boundQtyEnd);
  const rowClusters = clusterByY(inTable, rowYTolerance)
    .sort((a, b) => (avgY(a) - avgY(b)));

  // rowYToleranceは「別の品目の帯にまで跨って結合してしまわない」よう安全側（広め）に
  // 見積もられているため、1つの品目枠内に複数行（例：呼び径違いの2行）が本来の行間より
  // 狭い間隔で詰め込まれているテンプレートでは、それでもなお複数行分のSIZE/DESCRIPTION/QTYが
  // 1クラスタにまとまってしまうことがある（例：SIZE欄が「300A 20A」のように2つ入ってしまう）。
  // そのため、クラスタ内のY方向のばらつきが「同一行内の文字のブレ」として妥当な範囲を超えて
  // 大きい場合は、より厳しい許容誤差で再度クラスタリングし直し、複数行に分割する。
  const fineTolerance = Math.max(1.5, rowYTolerance * 0.4);

  for (const cluster of rowClusters) {
    const clusterY = avgY(cluster);
    const band = bands.find(b => clusterY >= b.y0 && clusterY < b.y1);
    if (!band) continue; // どの品目の帯にも属さない行（帯の外側）は対象外

    const ys = cluster.map(c => c.yc);
    const ySpread = Math.max(...ys) - Math.min(...ys);
    const subClusters = ySpread > fineTolerance * 2
      ? clusterByY(cluster, fineTolerance)
      : [cluster];

    for (const sub of subClusters) {
      const row = buildMaterialRowFromCluster(sub, bounds, band);
      if (row) result.push(row);
    }
  }
  return result;
}

// 1つの物理行分のセル群（同一Y帯にまとまったセル）から、SIZE/DESCRIPTION/QTYの各列テキストを
// 組み立てて1件の材料行データを生成する。
function buildMaterialRowFromCluster(cluster, bounds, band) {
  const sizeParts = [];
  const descParts = [];
  const qtyParts = [];
  for (const c of cluster) {
    if (c.xc < bounds.boundSizeDesc) {
      sizeParts.push([c.x0, c.text]);
    } else if (c.xc < bounds.boundDescQty) {
      descParts.push([c.x0, c.text]);
    } else {
      qtyParts.push([c.x0, c.text]);
    }
  }
  // 各列内のセルはX座標順に並べてから連結する（PDF内部の格納順が見た目の並び順と
  // 限らないため、常にX座標でソートしてから連結することで語順の入れ替わりを防ぐ）。
  sizeParts.sort((a, b) => a[0] - b[0]);
  descParts.sort((a, b) => a[0] - b[0]);
  qtyParts.sort((a, b) => a[0] - b[0]);
  const size = sizeParts.map(p => p[1]).join(' ');
  const rawDescription = descParts.map(p => p[1]).join(' ');
  // 行の帯判定・Y方向の再分割が万一ズレて複数行分のQTYが1行に残ってしまった場合でも、
  // 空白なしで連結すると「2」と「1」が「21」のような別の数値に化けてしまうため、
  // 空白区切りで連結する（正しく1行に分かれていれば通常は1つの値のみが入る）。
  const qty = qtyParts.map(p => p[1]).join(' ');
  if (!size && !rawDescription && !qty) return null; // 空行（未使用の品目）は除外

  // AutoCAD由来の図面では、記号（φ・°・±等）がテキストとして正しく変換されず
  // 「%%C」「%%D」「%%P」といった制御コードのまま残ることがある。
  // 実際の記号に置き換える（%%C=φ直径記号／%%D=°度記号／%%P=±プラスマイナス）。
  const fixAutocadSymbols = s => String(s || '')
    .replace(/%%[cC]/g, 'φ')
    .replace(/%%[dD]/g, '°')
    .replace(/%%[pP]/g, '±');
  const cleanSize = fixAutocadSymbols(size);
  const cleanDescription = fixAutocadSymbols(rawDescription);

  const { desc: description, qty: cleanedQty, tag } = extractSupplyReuseTag(cleanDescription, qty);
  const boltType = band.key === 'BOLT&NUT' ? deriveBoltType(band.label) : '';
  return reclassifyBoltGasket({ item: band.key, size: cleanSize, description, tag, qty: cleanedQty, boltType });
}

// 仕様(DESCRIPTION)欄・数量(QTY)欄のどちらかに「支給」「転用」「既設転用」「既設使用」の文字が
// 混じっているケースを検出し、別項目（支給品／転用品／既設転用）として切り出す。
// 該当欄からは該当の文字列を除去する（QTY欄はこれにより数値のみが残る）。
// 「既設使用」は「既設転用」と同じ意味合いで使われている表記ゆれのため、同じ区分にまとめる。
function extractSupplyReuseTag(desc, qty) {
  const combined = `${desc || ''} ${qty || ''}`;
  let tag = '';
  // 「既設転用」は「転用」を含むため、先に判定しないと単なる「転用品」に埋もれてしまう
  if (/既設転用|既設使用/.test(combined)) tag = '既設転用';
  else if (/転用/.test(combined)) tag = '転用品';
  else if (/支給/.test(combined)) tag = '支給品';
  const strip = s => (!s || !tag) ? (s || '') : s
    .replace(/[（(]\s*(既設転用|既設使用|支給品?|転用品?)\s*[）)]/g, ' ')
    .replace(/(既設転用|既設使用|支給品?|転用品?)/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim();
  return { desc: strip(desc), qty: strip(qty), tag };
}

function sanitizeFilename(name) {
  return name.replace(/[\\/:*?"<>|]/g, '_').trim();
}

// 出力(Excel/ZIP)のベース名。1ファイルなら元の名前、複数ファイルなら件数を明示する
function outputBaseName() {
  if (loadedFiles.length === 1) return loadedFiles[0].name;
  return `一括処理_${loadedFiles.length}件`;
}

function buildFilename(drawingNo, lawCode, issueDate, series, jobNo) {
  if (!drawingNo) {
    return issueDate ? `図書リスト_${jobNo}_${issueDate}` : `図書リスト_${jobNo}`;
  }
  const d = sanitizeFilename(drawingNo);
  // 親図(100番代)と土建図(600番台以降・要確認)には適用法規欄が存在しないため、
  // 法規コード("N"=なし)をファイル名に含めない
  if (series === '親図' || series === '要確認') {
    return issueDate ? `${d}_${issueDate}` : d;
  }
  return issueDate ? `${d}_${lawCode}_${issueDate}` : `${d}_${lawCode}`;
}

// ============================================================
// 出力行データ生成（プレビュー表示・Excel書き込みの両方で共通利用）
// ============================================================
function buildOutputRows() {
  const rows = [];
  let prevDrawingNo = null;
  pageData.forEach(e => {
    const key = e.drawingNo || '(未検出)';
    (e.materials || []).forEach(m => {
      const item = boltDisplayItem(m.item, m.boltType);
      // サイズ欄（例：50A×25A）は全角×・半角x・大文字Xが図面によって混在するため、
      // 表記を全角×に統一する（サイズ欄は「径×径」以外の意味を持たないため、一律置換で問題ない）。
      const size = String(m.size || '').replace(/[×xX]/g, '×');
      const pipeWeight = item === 'PIPE' ? pipeWeightPerMeter(size, m.description) : null;
      let unitWeight = 0, remark = '';
      if (pipeWeight) {
        if (pipeWeight.weight !== null) unitWeight = pipeWeight.weight;
        if (pipeWeight.note) remark = pipeWeight.note;
      }
      const newDrawing = prevDrawingNo !== null && key !== prevDrawingNo;
      prevDrawingNo = key;
      const { pipeClass, gasketClass, insulationSpec } = extractPipeAndGasketClass(e.lineNo);
      rows.push({
        sourceFile: e.sourceFile || '',
        drawingNo: key,
        jobNo: e.jobNo || '',
        lineNo: e.lineNo || '',
        lawText: lawToText(e.lawCode),
        pipeClass,
        gasketClass,
        insulationSpec,
        page: e.pageIndex + 1,
        item,
        size,
        material: normalizeMaterialText(m.description),
        tag: m.tag || '',
        tagText: m.tag || '',
        qty: m.qty,
        unitWeight,
        remark,
        connType: '',
        newDrawing
      });
    });
  });
  return rows;
}

// ============================================================
// 列定義（Excel出力・プレビュー・コピーで共通に使う「唯一の正」）
// ============================================================
// テンプレート「材料集計.xlsx」の1行目の見出しと、A〜V列の並び順に完全に一致させる。
// プレビュー・コピー（TSV）はここを基準に全22列をそのまま表示・出力するため、
// 実際のExcelにコピー＆ペーストしても列がズレない。
// autoFilled:false の列（A・C・M・N・P・Q・S・T・U・V）はPDFから自動判定できないため、
// 値は空欄のまま、列の位置だけ揃えて出力する。
const COLUMN_DEFS = [
  { col: 'A', header: '計算式用',       autoFilled: false },
  { col: 'B', header: '断熱仕様',       autoFilled: true,  get: r => r.insulationSpec },
  { col: 'C', header: '塗装仕様',       autoFilled: false },
  { col: 'D', header: 'JOBNo',         autoFilled: true,  get: r => r.jobNo },
  { col: 'E', header: '図面番号',       autoFilled: true,  get: r => r.drawingNo },
  { col: 'F', header: '適用法規',       autoFilled: true,  get: r => r.lawText },
  { col: 'G', header: '配管クラス',     autoFilled: true,  get: r => r.pipeClass },
  { col: 'H', header: 'ガスケットクラス', autoFilled: true, get: r => r.gasketClass },
  { col: 'I', header: 'ITEM',          autoFilled: true,  get: r => r.item },
  { col: 'J', header: 'サイズ',         autoFilled: true,  get: r => r.size },
  { col: 'K', header: '材質',           autoFilled: true,  get: r => r.material },
  { col: 'L', header: '数量',           autoFilled: true,  get: r => r.qty, numeric: true },
  { col: 'M', header: '単位',           autoFilled: false },
  { col: 'N', header: '総M',            autoFilled: false },
  { col: 'O', header: '支給/転用',      autoFilled: true,  get: r => r.tagText },
  { col: 'P', header: '付属品個',       autoFilled: false },
  { col: 'Q', header: '付属品ｻｲｽﾞ',     autoFilled: false },
  { col: 'R', header: '重量',           autoFilled: true,  get: r => (r.unitWeight ? r.unitWeight : null), numeric: true },
  { col: 'S', header: 'B',             autoFilled: false },
  { col: 'T', header: '',              autoFilled: false },
  { col: 'U', header: 'DB',            autoFilled: false },
  { col: 'V', header: 'BM',            autoFilled: false }
];

// プレビュー・コピー用に「表示用の文字列」を1箇所で決める（重量だけ小数3桁表記にする等）。
function columnDisplayValue(def, r) {
  if (!def.autoFilled) return '';
  const v = def.get(r);
  if (v === null || v === undefined || v === '') return '';
  if (def.col === 'R') return Number(v).toFixed(2);
  return v;
}


// 読み取れなかったページ／ファイル、材料表が見つからなかったページを、それぞれ
// 「元ファイル名 ○ページ目」の形式で一覧表示するための共通ヘルパー。
function formatPageLabel(e) {
  const file = e.sourceFile || '-';
  return e.pageIndex == null ? `${file}（ファイル全体）` : `${file} ${e.pageIndex + 1}ページ目`;
}

function renderPreview() {
  if (!pageData.length) {
    previewWrap.innerHTML = '<div class="empty">解析結果がありません。</div>';
    return;
  }

  // 解析自体が失敗した（例外が発生した）ページ・ファイル。これは明確な「読み取れなかった」ケースで、
  // Excelには反映されないため、目立つ形で必ず知らせる。
  const failedPages = pageData.filter(e => e.readFailed);
  // 解析はできたが材料表が1件も見つからなかったページ。図書リストや親図など、
  // 元々材料表が無いページも含まれ得るため、あくまで「念のため確認用」の注意書きとして分けて表示する。
  const noMaterialPages = pageData.filter(e => !e.readFailed && (!e.materials || !e.materials.length));

  let html = '';

  if (failedPages.length) {
    html += `<div class="note" style="background:var(--err-bg); border-color:#E3AFA8; color:#8a2f22;">
      <strong>読み取れなかったページ／ファイルが${failedPages.length}件あります。</strong>
      PDFの破損・パスワード保護・特殊なページ構成等が原因の可能性があります。以下の箇所はExcelには出力されませんので、内容を手入力するか、該当のPDFを確認のうえ再度お試しください。
      <ul style="margin:8px 0 0; padding-left:18px;">
        ${failedPages.map(e => `<li>${escapeHtml(formatPageLabel(e))}：${escapeHtml(e.readError || '不明なエラー')}</li>`).join('')}
      </ul>
    </div>`;
  }

  const rows = buildOutputRows();

  if (!rows.length) {
    html += '<div class="empty">材料表が検出されたページがありません。</div>';
    previewWrap.innerHTML = html;
    return;
  }

  const multi = loadedFiles.length > 1;
  // Excelテンプレートの列（A〜V列）とまったく同じ列・同じ並び順で表示する。
  // 自動抽出できない列は空欄のまま列位置だけ揃えるので、コピーしてExcelに貼り付けても列がズレない。
  // 「元ファイル」は参考情報のため、A〜V列の並びを崩さないよう一番最後に追加する。
  html += `<div style="max-height:480px; overflow:auto;"><table><thead><tr>
    ${COLUMN_DEFS.map(def => `<th${!def.autoFilled ? ' style="color:#9aa4ad; font-weight:500;"' : ''}>${escapeHtml(def.header) || '&nbsp;'}${!def.autoFilled ? '<br><span style="font-weight:400;">(未対応)</span>' : ''}</th>`).join('')}
    ${multi ? '<th>元ファイル</th>' : ''}
  </tr></thead><tbody>`;
  rows.forEach(r => {
    html += `<tr${r.newDrawing ? ' style="border-top:3px solid var(--navy);"' : ''}>
      ${COLUMN_DEFS.map(def => `<td${!def.autoFilled ? ' style="color:#c3c9ce;"' : ' class="mono"'}>${escapeHtml(columnDisplayValue(def, r))}</td>`).join('')}
      ${multi ? `<td class="mono">${escapeHtml(r.sourceFile || '-')}</td>` : ''}
    </tr>`;
  });
  html += '</tbody></table></div>';

  if (noMaterialPages.length) {
    html += `<div class="note">
      材料表が検出されなかったページが${noMaterialPages.length}件あります（図書リストや親図など、元々材料表が無いページの可能性もありますが、念のためご確認ください）。
      <ul style="margin:8px 0 0; padding-left:18px;">
        ${noMaterialPages.map(e => `<li>${escapeHtml(formatPageLabel(e))}${e.drawingNo ? '（' + escapeHtml(e.drawingNo) + '）' : ''}</li>`).join('')}
      </ul>
    </div>`;
  }

  previewWrap.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// パイプ単位重量（Q列「重量(kg/m)」の算出のみソフト側で行う）
// ============================================================
// SIZE欄の文字列から「呼び径(A)の数値」をすべて抽出する（例："50A×40A" → [50, 40]）。
function extractSizeValues(sizeStr) {
  if (!sizeStr) return [];
  const matches = [...String(sizeStr).matchAll(/(\d+(?:\.\d+)?)\s*A/gi)];
  return matches.map(m => parseFloat(m[1]));
}

// SGP（配管用炭素鋼鋼管 JIS G3452）の呼び径別 単位質量(kg/m)。規格の記載がない
// パイプは、この表を使って重量を計算する（現場で最も一般的な想定のため）。
const SGP_WEIGHT_TABLE = {6:0.419,8:0.652,10:0.652,15:1.31,20:1.68,25:2.43,32:3.38,40:3.89,50:5.31,65:7.47,80:8.79,90:10.1,100:12.2,125:15.0,150:19.8,175:24.2,200:30.1,225:36.0,250:42.4,300:53.0,350:67.7,400:77.6,450:87.5,500:97.4};

// 呼び径別の外径(mm)。SGP以外の規格（Sch指定）の肉厚概算にも使用する共通値。
const OD_TABLE = {6:10.5,8:13.8,10:17.3,15:21.7,20:27.2,25:34.0,32:42.7,40:48.6,50:60.5,65:76.3,80:89.1,90:101.6,100:114.3,125:139.8,150:165.2,175:190.7,200:216.3,225:241.8,250:267.4,300:318.5,350:355.6,400:406.4,450:457.2,500:508.0,600:609.6};

// パイプ1mあたりの重量(kg/m)を算出する。
// ・仕様欄にSch番号の記載がある場合：外径表と呼び厚さの近似式(t=Sch×D/1750+2.54)から
//   肉厚を概算し、幾何学的に重量を計算する（SUSは密度7.93、それ以外は7.85 g/cm3）。
// ・記載がない場合：SGP規格表（実測値）をそのまま使う。
// ・25A以下は25A（＝1インチ）の値で計算する。
function pipeWeightPerMeter(sizeStr, descriptionStr) {
  const sizes = extractSizeValues(sizeStr);
  if (!sizes.length) return { weight: null, note: 'サイズを認識できませんでした' };
  const lookupA = sizes[0] <= 25 ? 25 : sizes[0];
  const desc = String(descriptionStr || '');
  const schMatch = desc.match(/Sch\s*\.?\s*(\d+)\s*S?/i);

  if (!schMatch) {
    const w = SGP_WEIGHT_TABLE[lookupA];
    if (w === undefined) return { weight: null, note: `${lookupA}Aの単位質量が未登録です` };
    return { weight: w, note: '規格記載なしのためSGPとして計算' };
  }

  const sch = parseInt(schMatch[1], 10);
  const isSUS = /SUS/i.test(desc);
  const od = OD_TABLE[lookupA];
  if (od === undefined) return { weight: null, note: `${lookupA}Aの外径データがありません` };
  const t = (sch * od) / 1750 + 2.54;
  const idmm = od - 2 * t;
  const density = isSUS ? 7.93 : 7.85; // g/cm3
  const areaCm2 = (Math.PI / 4) * ((od / 10) ** 2 - (idmm / 10) ** 2);
  const weightPerM = areaCm2 * density * 0.1; // kg/m
  return { weight: weightPerM, note: `Sch${sch}${isSUS ? '(SUS)' : ''}の近似式で計算（要確認）` };
}

// ============================================================
// Excel出力
// ============================================================
// 添付の「材料集計.xlsx」をそのままテンプレートとして使用し、
// 「材料集計(図面別)」シートに書き込む（このシートのみの単一シート構成で、数式は

const DATA_START_ROW = 2;
const LAST_COLUMN_INDEX = 22; // A〜V列（テンプレートの見出し範囲）

// テンプレート側の罫線は、あらかじめ用意された行数までは極細線(hair)、それを超える行は
// 線なし、さらに図面の切れ目だけ太線と、行によってバラバラだった。
// 出力する行はすべてA〜V列に同じ細線を明示的に設定し、統一する。
// 罫線はテンプレート本来の見た目に合わせて hair（極細線）にする（thinだと少し太く見えるため）。
const THIN_BORDER = { style: 'hair', color: { argb: 'FF000000' } };
const THIN_BORDER_ALL_SIDES = { top: THIN_BORDER, bottom: THIN_BORDER, left: THIN_BORDER, right: THIN_BORDER };
// 図面の切れ目は、他の罫線(hair)より少し太い thin にして視認できるように区別する。
const DIVIDER_BORDER = { style: 'thin', color: { argb: 'FF12283F' } };
// 罫線なし（テンプレートにあらかじめ敷かれている、出力行より下の罫線を消すために使う）。
const NO_BORDER_ALL_SIDES = { top: {}, bottom: {}, left: {}, right: {} };

// ExcelJSは「テンプレート内で個別にスタイルを変更していないセル」を列単位で同じスタイル
// オブジェクトを共有している。そのため cell.border = X のようにプロパティを直接書き換えると
// 同じオブジェクトを参照している他の行（本来変更するつもりのない行）にまで変更が
// 波及してしまう。cell.style ごと新しいオブジェクトに差し替えることで、対象セルだけを
// 独立させて安全に変更する。
function setCellBorder(cell, border) {
  cell.style = Object.assign({}, cell.style, { border });
}

function applyUniformBorder(row) {
  for (let c = 1; c <= LAST_COLUMN_INDEX; c++) {
    setCellBorder(row.getCell(c), THIN_BORDER_ALL_SIDES);
  }
}

function addTopBorder(row) {
  for (let c = 1; c <= LAST_COLUMN_INDEX; c++) {
    const cell = row.getCell(c);
    setCellBorder(cell, Object.assign({}, cell.style.border, { top: DIVIDER_BORDER }));
  }
}

// テンプレートは2行目から200行超まで、あらかじめ全列に罫線が敷かれている。
// 出力したデータ行より下は、テンプレートの罫線が残ったままだと表がまだ続いているように
// 見えてしまうため、実際に書き込んだ最終行より下の罫線をすべて消す。
function clearBordersBelow(ws, fromRow) {
  const lastRow = ws.rowCount || fromRow;
  for (let r = fromRow; r <= lastRow; r++) {
    const row = ws.getRow(r);
    for (let c = 1; c <= LAST_COLUMN_INDEX; c++) {
      setCellBorder(row.getCell(c), NO_BORDER_ALL_SIDES);
    }
    row.commit();
  }
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

// テンプレート（材料集計.xlsx）はあらかじめ211行分（2〜212行目）にしかセル書式
// （フォント等。特に「材質」列は明示的にMS P明朝が指定されている）が定義されておらず、
// 出力行数がそれを超えると、ExcelJSが書式なしの新規セルを追加してしまい、材質列などで
// 途中からフォント（MS P明朝 → 既定のゴシック相当）が変わって見える不具合があった。
// テンプレート内の基準行（STYLE_REF_ROW）のセル書式を保持しておき、書き込む行数に
// かかわらず、値を入れる前に必ずこの書式を複製することでフォントを統一する。
const STYLE_REF_ROW = 2;

function buildStyleCache(ws) {
  const cache = {};
  const refRow = ws.getRow(STYLE_REF_ROW);
  for (let c = 1; c <= LAST_COLUMN_INDEX; c++) {
    cache[c] = Object.assign({}, refRow.getCell(c).style);
  }
  return cache;
}

function writeMaterialRow(ws, r, d, styleCache) {
  const row = ws.getRow(r);
  for (let c = 1; c <= LAST_COLUMN_INDEX; c++) {
    row.getCell(c).style = Object.assign({}, styleCache[c]);
  }
  COLUMN_DEFS.forEach(def => {
    if (!def.autoFilled) return; // 自動抽出できない列はテンプレートの値のまま（空欄）にしておく
    let v = def.get(d);
    if (v === '' || v === undefined) v = null;
    // 数量・重量は、SUM等の数式でそのまま集計できるよう、Excel上も数値セルとして
    // 書き込む（文字列のままだとSUMが0扱い・エラーになるため）。
    // 「20A 15A」のように空白区切りで複数値が結合されてしまっている等、単純な数値に
    // 変換できない場合は元の文字列のまま出力する（数式が使えない旨は別途目視で気づける）。
    if (def.numeric && v !== null) {
      const n = Number(v);
      if (!Number.isNaN(n) && String(v).trim() !== '') {
        // 重量(R列)は0.01単位で十分なため、書き込み時点で丸めておく
        // （プレビュー表示の桁数とも一致させる）。
        v = def.col === 'R' ? Math.round(n * 100) / 100 : n;
      }
    }
    row.getCell(def.col).value = v;
  });
  applyUniformBorder(row);
  row.commit();
  return row;
}

btnExcel.addEventListener('click', async () => {
  if (!pageData.length) return;
  btnExcel.disabled = true;
  saveStatus.textContent = 'Excelを作成中...';

  try {
    // テンプレート（材料集計.xlsx）を読み込む。見出し行・書式・列幅はそのまま使う。
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(base64ToArrayBuffer(TEMPLATE_XLSX_BASE64));
    const ws3 = wb.getWorksheet('材料集計(図面別)');
    const styleCache = buildStyleCache(ws3);

    const outputRows = buildOutputRows();

    let r = DATA_START_ROW;
    outputRows.forEach(d => {
      writeMaterialRow(ws3, r, d, styleCache);
      if (d.newDrawing) addTopBorder(ws3.getRow(r));
      r++;
    });
    clearBordersBelow(ws3, r);

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `材料集計_${outputBaseName()}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);

    const filledCols = COLUMN_DEFS.filter(d => d.autoFilled).map(d => d.col).join('・');
    const emptyCols = COLUMN_DEFS.filter(d => !d.autoFilled).map(d => d.col).join('・');
    saveStatus.textContent = `Excelを出力しました（テンプレート「材料集計.xlsx」の見出し・書式はそのまま。${filledCols}列のみ書き込み、${emptyCols}列は未対応のため空欄です）。`;
  } catch (err) {
    console.error('Excel出力に失敗しました', err);
    saveStatus.textContent = `Excel出力に失敗しました：${err && err.message ? err.message : err}`;
  } finally {
    btnExcel.disabled = false;
  }
});

// プレビュー表をタブ区切りテキスト（TSV）としてクリップボードにコピーする。
// TSVはExcelに貼り付けると自動的にセルごとに分かれて入るため、
// 「別のExcelにコピペして運用する」用途に使う。既存シートの見出し行はそのまま活かす想定のため、
// 見出し行は含めず、断熱仕様(B列)〜重量(R列)のデータだけをコピーする。
const COPY_RANGE_START_COL = 'B'; // 断熱仕様
const COPY_RANGE_END_COL = 'R';   // 重量
const COPY_COLUMN_DEFS = COLUMN_DEFS.slice(
  COLUMN_DEFS.findIndex(d => d.col === COPY_RANGE_START_COL),
  COLUMN_DEFS.findIndex(d => d.col === COPY_RANGE_END_COL) + 1
);

function buildPreviewTsv() {
  const rows = buildOutputRows();
  if (!rows.length) return null;

  // TSVの中でタブや改行が値に混じるとズレの原因になるため、半角スペースに置き換える。
  const clean = v => String(v == null ? '' : v).replace(/[\t\r\n]+/g, ' ');

  const lines = [];
  rows.forEach(r => {
    const cells = COPY_COLUMN_DEFS.map(def => columnDisplayValue(def, r));
    lines.push(cells.map(clean).join('\t'));
  });
  return lines.join('\n');
}

btnCopy.addEventListener('click', async () => {
  const tsv = buildPreviewTsv();
  if (!tsv) {
    copyStatus.textContent = 'コピーできる行がありません（材料表が検出されたページがありません）。';
    return;
  }

  try {
    await navigator.clipboard.writeText(tsv);
  } catch (err) {
    // クリップボードAPIが使えない環境（権限制限等）向けのフォールバック。
    try {
      const ta = document.createElement('textarea');
      ta.value = tsv;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (err2) {
      console.error('コピーに失敗しました', err, err2);
      copyStatus.textContent = 'コピーに失敗しました。プレビュー欄の表を直接選択してコピーしてください。';
      return;
    }
  }
  const rowCount = tsv.split('\n').length;
  copyStatus.textContent = `コピーしました（${rowCount}行）。Excelのセルに貼り付けてください。`;
});

</script>
